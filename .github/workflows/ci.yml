# CI is the source of truth for merge readiness (DEVELOPMENT_RULES §2).
# Pipeline per ADR-0002: install → typecheck → lint → unit → integration → build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: senstar
          POSTGRES_PASSWORD: senstar_ci
          POSTGRES_DB: senstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U senstar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://senstar:senstar_ci@localhost:5432/senstar_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Tests (unit + integration)
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://senstar:senstar_ci@localhost:5432/senstar_test
          BETTER_AUTH_SECRET: ci-only-placeholder-secret-value
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_ENV: test
