# @claude in issue and PR comments (docs/WORKING_WITH_CLAUDE.md §2).
#
# Environment mirrors ci.yml — Postgres 16 and installed dependencies — so a
# session can run `pnpm typecheck && pnpm lint && pnpm format && pnpm test`
# and verify its own work rather than guessing.
#
# Requires the CLAUDE_CODE_OAUTH_TOKEN repository secret. Without it the job
# fails fast with a clear message rather than running unauthenticated.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Cost guardrail. Raise deliberately when a task genuinely needs longer.
    timeout-minutes: 30
    # Queue rather than parallelise runs on the same thread.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # read CI results on PRs
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: senstar
          POSTGRES_PASSWORD: senstar_ci
          POSTGRES_DB: senstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U senstar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://senstar:senstar_ci@localhost:5432/senstar_test
    steps:
      - name: Fail fast if the OAuth token is not configured
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Run 'claude setup-token' locally, then add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cost guardrail, paired with timeout-minutes above.
          claude_args: |
            --max-turns 40
